[project]
name = "voice-operator"
version = "0.1.0"
description = "Voice-operated accessibility operator for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Send2Trash>=1.8.3",
    "faster-whisper>=1.1.1",
    "pydantic>=2.0.0",
    "keyboard>=0.13.5",
    "llama-cpp-python>=0.3.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.19.0",
    "sounddevice>=0.4.6",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "psutil>=6.0.0",
    "pyttsx3>=2.98",
    "pywin32>=306",
    "pywinauto>=0.6.8",
    "scipy>=1.14.0",
    "rapidfuzz>=3.0.0",
    "vosk>=0.3.45",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "integration: machine-dependent hardware/GUI integration tests using real local models/audio"
]
addopts = "-m 'not integration'"